<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InsightFlow · Tablero ejecutivo</title>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --pu-bg: #0b0e1b;
      --pu-surface: rgba(22, 27, 48, 0.72);
      --pu-surface-solid: #12162a;
      --pu-border: rgba(124, 255, 107, 0.14);
      --pu-text: #e8edf5;
      --pu-muted: #8b98a8;
      --pu-accent: #39ff14;
      --pu-accent-soft: #7cff6b;
      --pu-danger: #ff6b6b;
      --pu-radius: 14px;
      --pu-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--pu-text);
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(57, 255, 20, 0.06), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(58, 95, 184, 0.12), transparent 50%),
        var(--pu-bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 20px;
      background: rgba(12, 16, 28, 0.85);
      border-bottom: 1px solid var(--pu-border);
      backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 10px; height: 36px;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--pu-accent-soft), var(--pu-accent));
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.35);
      flex-shrink: 0;
    }
    .brand-text strong { display: block; font-size: 15px; letter-spacing: 0.02em; }
    .brand-text span { font-size: 11px; color: var(--pu-muted); letter-spacing: 0.06em; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(57, 255, 20, 0.12);
      border: 1px solid rgba(57, 255, 20, 0.35);
      color: var(--pu-accent); font-size: 12px; font-weight: 700;
    }
    .live-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--pu-accent);
      box-shadow: 0 0 8px var(--pu-accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .toolbar button, .toolbar a.btn-link {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--pu-border);
      background: var(--pu-surface-solid);
      color: var(--pu-text);
      font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      transition: border-color 0.15s, background 0.15s;
    }
    .toolbar button:hover, .toolbar a.btn-link:hover {
      border-color: var(--pu-accent);
      background: rgba(57, 255, 20, 0.08);
    }
    .toolbar button.primary {
      border-color: rgba(57, 255, 20, 0.45);
      background: rgba(57, 255, 20, 0.15);
      color: var(--pu-accent);
    }
    .toolbar button:disabled { opacity: 0.45; cursor: not-allowed; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px 18px 22px;
      position: relative;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(11, 14, 27, 0.72);
      color: var(--pu-muted); z-index: 8;
    }
    #loading[hidden] { display: none !important; }
    #board {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: auto auto;
      gap: 14px;
      flex: 1;
      min-height: 0;
      align-content: start;
    }
    #board.legacy {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }
    .card {
      background: var(--pu-surface);
      border: 1px solid var(--pu-border);
      border-radius: var(--pu-radius);
      box-shadow: var(--pu-shadow);
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      backdrop-filter: blur(8px);
    }
    .card::after {
      content: "";
      position: absolute; top: 14px; right: 14px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--pu-accent);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.55);
      opacity: 0.85;
    }
    .card-head {
      display: flex; flex-wrap: wrap; align-items: baseline;
      justify-content: space-between; gap: 8px;
      margin-bottom: 10px; padding-right: 18px;
    }
    .card-kicker {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--pu-muted); margin: 0 0 2px;
    }
    .card-title {
      margin: 0; font-size: 15px; font-weight: 700; color: var(--pu-text);
    }
    .card-sub {
      margin: 2px 0 0; font-size: 12px; color: var(--pu-muted);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      background: rgba(11, 14, 27, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .metric .label { font-size: 11px; color: var(--pu-muted); margin: 0 0 4px; }
    .metric .value {
      font-size: 18px; font-weight: 700; margin: 0;
      color: var(--pu-accent);
    }
    .metric .value.down { color: var(--pu-danger); }
    .metric .value.neutral { color: var(--pu-text); }
    .chart-box {
      flex: 1;
      min-height: 220px;
      width: 100%;
    }
    .card.span-wide { grid-column: 1; min-height: 340px; }
    .card.span-narrow { grid-column: 2; min-height: 340px; }
    .card.span-third { min-height: 260px; }
    .card.span-full { grid-column: 1 / -1; min-height: 420px; }
    .bottom-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .qa-block {
      background: rgba(11, 14, 27, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .qa-block .q { margin: 0 0 8px; color: var(--pu-text); font-size: 13px; }
    .qa-block .a { margin: 0; color: var(--pu-accent); font-size: 13px; font-weight: 600; }
    .qa-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--pu-muted); margin: 0 0 4px; }
    .bullets { margin: 0; padding-left: 18px; color: var(--pu-text); }
    .bullets li { margin-bottom: 10px; color: var(--pu-muted); }
    .bullets li::marker { color: var(--pu-accent); }
    .err, .pending {
      padding: 32px 24px; text-align: center; max-width: 520px; margin: auto;
      line-height: 1.5;
    }
    .err { color: #f0b0b0; }
    .pending { color: #ffb4b4; }
    .pending strong { color: var(--pu-text); }
    .err code { color: var(--pu-accent-soft); }
    @media (max-width: 960px) {
      #board { grid-template-columns: 1fr; }
      .card.span-wide, .card.span-narrow, .card.span-full { grid-column: 1; }
      .bottom-row { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <strong id="board-title">InsightFlow</strong>
        <span id="board-subtitle">Tablero ejecutivo · ECharts</span>
      </div>
    </div>
    <div class="toolbar">
      <span class="live-badge" id="live-badge" hidden><span class="dot" aria-hidden="true"></span> Live</span>
      <button type="button" id="btn-filter" title="Filtros (próximamente)">Filtrar</button>
      <button type="button" id="btn-png" class="primary" disabled title="Exportar vista actual">Descargar PNG</button>
      <button type="button" id="btn-reload" disabled>Recargar</button>
      <a class="btn-link" href="https://www.powerupsagencia.com/portal-premium/">Mis tableros</a>
    </div>
  </header>

  <main>
    <div class="loading" id="loading">Cargando tablero…</div>
    <div id="board" aria-live="polite"></div>
  </main>

  <script>
(function () {
  var _apiFromStorage = '';
  try { _apiFromStorage = (localStorage.getItem('powerups_edge_api_base') || ''); } catch (e) {}
  var _apiFromParam = new URLSearchParams(window.location.search).get('api') || '';
  var API_BASE = (
    (typeof window.POWERUPS_API_BASE === 'string' && window.POWERUPS_API_BASE) ||
    _apiFromParam ||
    _apiFromStorage ||
    ''
  ).replace(/\/$/, '');

  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var CHAT_ID_KEY = 'powerups_edge_chat_id_v1';
  var CHARTS_PREFIX = 'powerups_edge_charts_';
  var boardEl = document.getElementById('board');
  var loadingEl = document.getElementById('loading');
  var btnPng = document.getElementById('btn-png');
  var btnReload = document.getElementById('btn-reload');
  var btnFilter = document.getElementById('btn-filter');
  var liveBadge = document.getElementById('live-badge');
  var chartInstances = [];

  echarts.registerTheme('powerups', {
    color: ['#39FF14', '#7CFF6B', '#3a5fb8', '#6bc9a8', '#d4a853', '#ff6b6b', '#9ec5ff'],
    backgroundColor: 'transparent',
    textStyle: { fontFamily: 'Segoe UI, system-ui, sans-serif' },
    categoryAxis: {
      axisLine: { lineStyle: { color: '#8b98a8' } },
      axisLabel: { color: '#8b98a8' },
      splitLine: { lineStyle: { color: '#1e2638' } }
    },
    valueAxis: {
      axisLine: { lineStyle: { color: '#8b98a8' } },
      axisLabel: { color: '#8b98a8' },
      splitLine: { lineStyle: { color: '#1e2638' } }
    },
    title: { textStyle: { color: '#e8edf5' } },
    legend: { textStyle: { color: '#8b98a8' } },
    tooltip: {
      backgroundColor: 'rgba(18, 22, 42, 0.94)',
      borderColor: 'rgba(57,255,20,0.25)',
      textStyle: { color: '#e8edf5' }
    }
  });

  function showError(msg) {
    loadingEl.hidden = true;
    boardEl.className = 'legacy';
    boardEl.innerHTML = '<div class="err"><p>' + msg + '</p></div>';
  }

  function showPreparing(msg) {
    loadingEl.hidden = true;
    btnPng.disabled = true;
    btnReload.disabled = false;
    boardEl.className = 'legacy';
    boardEl.innerHTML = '<div class="pending"><p><strong>Preparando tablero…</strong></p><p>' +
      (msg || 'Genera la gráfica enviando un mensaje en el chat.') + '</p></div>';
  }

  function sessionURL(tok) {
    return API_BASE + '/api/v1/dashboard/session/' + encodeURIComponent(tok);
  }

  function fetchSession(tok) {
    var headers = { 'Accept': 'application/json' };
    if (window.location.hostname.indexOf('ngrok') !== -1) {
      headers['ngrok-skip-browser-warning'] = 'true';
    }
    return fetch(sessionURL(tok), { credentials: 'omit', headers: headers }).then(function (r) {
      if (r.status === 202) {
        return r.json().then(function (body) {
          return { __pending: true, message: (body && body.message) ? body.message : '' };
        });
      }
      if (!r.ok) {
        var st = r.status;
        if (st === 404) return { __pending404: true };
        if ((st === 409 || st === 401 || st === 403) && window.parent !== window) {
          try {
            window.parent.postMessage({ type: 'insightflow-dashboard', action: 'token_refresh', status: st }, '*');
          } catch (e) {}
        }
        throw new Error('HTTP ' + st);
      }
      return r.json();
    });
  }

  function disposeCharts() {
    chartInstances.forEach(function (c) {
      try { c.dispose(); } catch (e) {}
    });
    chartInstances = [];
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function normalizeDashboard(sessionData) {
    if (!sessionData || typeof sessionData !== 'object') return null;
    if (sessionData.dashboard && typeof sessionData.dashboard === 'object') {
      return sessionData.dashboard;
    }
    var opt = sessionData.echarts_option != null ? sessionData.echarts_option : null;
    if (!opt || typeof opt !== 'object') {
      // Compat: payload plano ECharts
      if (sessionData.series || sessionData.xAxis) opt = sessionData;
    }
    if (!opt || typeof opt !== 'object') return null;
    return {
      title: 'Panel unificado',
      subtitle: 'InsightFlow · Análisis',
      live: false,
      metrics: [],
      widgets: [{
        id: 'main_trend',
        kind: 'echarts',
        title: 'Panel unificado',
        span: 'full',
        option: opt
      }]
    };
  }

  function renderMetrics(metrics) {
    if (!metrics || !metrics.length) return '';
    var html = '<div class="metrics">';
    metrics.slice(0, 3).forEach(function (m) {
      var tone = (m && m.tone) || 'up';
      html += '<div class="metric"><p class="label">' + escapeHtml(m.label || '') +
        '</p><p class="value ' + escapeHtml(tone) + '">' + escapeHtml(m.value || '') + '</p></div>';
    });
    html += '</div>';
    return html;
  }

  function mountEcharts(el, option) {
    if (!el || !option) return null;
    var inst = echarts.init(el, 'powerups', { renderer: 'canvas' });
    inst.setOption(option, true);
    chartInstances.push(inst);
    return inst;
  }

  function renderDashboard(dash) {
    disposeCharts();
    boardEl.innerHTML = '';
    boardEl.className = '';

    document.getElementById('board-title').textContent = dash.title || 'InsightFlow';
    document.getElementById('board-subtitle').textContent = dash.subtitle || 'Tablero ejecutivo · ECharts';
    liveBadge.hidden = !dash.live;

    var widgets = Array.isArray(dash.widgets) ? dash.widgets.slice() : [];
    var metrics = Array.isArray(dash.metrics) ? dash.metrics : [];

    // Clasificar slots del mockup
    var main = null, perception = null, scenarios = null, qa = null, exec = null, extras = [];
    widgets.forEach(function (w) {
      if (!w) return;
      if (w.id === 'main_trend' || (!main && w.kind === 'echarts' && w.span === 'wide')) main = w;
      else if (w.id === 'perception' || (!perception && w.span === 'narrow')) perception = w;
      else if (w.id === 'scenarios') scenarios = w;
      else if (w.id === 'qa' || w.kind === 'qa') qa = w;
      else if (w.id === 'exec' || w.kind === 'bullets') exec = w;
      else extras.push(w);
    });
    if (!main) {
      main = widgets.find(function (w) { return w && w.kind === 'echarts'; }) || null;
    }

    // Legacy: un solo widget full
    if (widgets.length === 1 && widgets[0].span === 'full') {
      boardEl.className = 'legacy';
      var only = widgets[0];
      var card = document.createElement('div');
      card.className = 'card span-full';
      card.innerHTML =
        '<div class="card-head"><div>' +
        '<p class="card-kicker">Ejemplo de interfaz</p>' +
        '<h2 class="card-title">' + escapeHtml(only.title || 'Panel') + '</h2>' +
        '</div></div>' +
        renderMetrics(metrics) +
        '<div class="chart-box" id="chart-0"></div>';
      boardEl.appendChild(card);
      mountEcharts(document.getElementById('chart-0'), only.option);
    } else {
      // Top: wide + narrow
      if (main) {
        var mainCard = document.createElement('div');
        mainCard.className = 'card span-wide';
        mainCard.innerHTML =
          '<div class="card-head"><div>' +
          '<p class="card-kicker">Ejemplo de interfaz</p>' +
          '<h2 class="card-title">' + escapeHtml(main.title || 'Panel unificado') + '</h2>' +
          '<p class="card-sub">' + escapeHtml(dash.subtitle || '') + '</p>' +
          '</div></div>' +
          renderMetrics(metrics) +
          '<div class="chart-box" id="chart-main-w"></div>';
        boardEl.appendChild(mainCard);
        mountEcharts(document.getElementById('chart-main-w'), main.option);
      }
      if (perception && perception.kind === 'echarts') {
        var pCard = document.createElement('div');
        pCard.className = 'card span-narrow';
        pCard.innerHTML =
          '<div class="card-head"><div>' +
          '<p class="card-kicker">Escenario de aplicación</p>' +
          '<h2 class="card-title">' + escapeHtml(perception.title || 'Percepción') + '</h2>' +
          '</div></div>' +
          '<div class="chart-box" id="chart-perception"></div>';
        boardEl.appendChild(pCard);
        mountEcharts(document.getElementById('chart-perception'), perception.option);
      }

      var bottom = document.createElement('div');
      bottom.className = 'bottom-row';

      function appendQa(target) {
        var c = document.createElement('div');
        c.className = 'card span-third';
        var items = (qa && qa.items) || [];
        var body = '';
        items.forEach(function (it) {
          body += '<div class="qa-block">' +
            '<p class="qa-label">Pregunta</p><p class="q">' + escapeHtml(it.q || '') + '</p>' +
            '<p class="qa-label">Respuesta con fuente</p><p class="a">' + escapeHtml(it.a || '') + '</p>' +
            '</div>';
        });
        if (!body) body = '<p class="card-sub">Sin Q&amp;A para este análisis.</p>';
        c.innerHTML =
          '<div class="card-head"><div>' +
          '<p class="card-kicker">VitalDoc</p>' +
          '<h2 class="card-title">' + escapeHtml((qa && qa.title) || 'Flujo ilustrativo') + '</h2>' +
          '</div></div>' + body;
        target.appendChild(c);
      }

      function appendScenarios(target) {
        var c = document.createElement('div');
        c.className = 'card span-third';
        var title = (scenarios && scenarios.title) || 'Escenarios comparados';
        c.innerHTML =
          '<div class="card-head"><div>' +
          '<p class="card-kicker">Demostración conceptual</p>' +
          '<h2 class="card-title">' + escapeHtml(title) + '</h2>' +
          '</div></div>' +
          '<div class="chart-box" id="chart-scenarios"></div>';
        target.appendChild(c);
        if (scenarios && scenarios.option) {
          mountEcharts(document.getElementById('chart-scenarios'), scenarios.option);
        } else if (perception && perception.option) {
          mountEcharts(document.getElementById('chart-scenarios'), perception.option);
        }
      }

      function appendExec(target) {
        var c = document.createElement('div');
        c.className = 'card span-third';
        var items = (exec && exec.items) || [];
        var lis = items.map(function (t) {
          return '<li>' + escapeHtml(t) + '</li>';
        }).join('');
        c.innerHTML =
          '<div class="card-head"><div>' +
          '<p class="card-kicker">Copiloto ejecutivo</p>' +
          '<h2 class="card-title">' + escapeHtml((exec && exec.title) || 'Resumen ejecutivo') + '</h2>' +
          '</div></div>' +
          '<ul class="bullets">' + (lis || '<li>Sin hallazgos narrativos.</li>') + '</ul>';
        target.appendChild(c);
      }

      appendQa(bottom);
      appendScenarios(bottom);
      appendExec(bottom);
      boardEl.appendChild(bottom);

      extras.forEach(function (w, i) {
        if (w.kind !== 'echarts' || !w.option) return;
        var c = document.createElement('div');
        c.className = 'card span-full';
        var id = 'chart-extra-' + i;
        c.innerHTML =
          '<div class="card-head"><div><h2 class="card-title">' +
          escapeHtml(w.title || 'Vista adicional') +
          '</h2></div></div><div class="chart-box" id="' + id + '"></div>';
        boardEl.appendChild(c);
        mountEcharts(document.getElementById(id), w.option);
      });
    }

    btnPng.disabled = chartInstances.length === 0;
    btnReload.disabled = false;
    loadingEl.hidden = true;
  }

  function onResize() {
    chartInstances.forEach(function (c) {
      try { c.resize(); } catch (e) {}
    });
  }
  window.addEventListener('resize', onResize);

  function getLocalChartsArray() {
    try {
      var chatId = localStorage.getItem(CHAT_ID_KEY);
      if (!chatId) return [];
      var raw = localStorage.getItem(CHARTS_PREFIX + String(chatId));
      if (!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr.filter(function (o) { return o && typeof o === 'object'; }) : [];
    } catch (e) { return []; }
  }

  function tryFallbackToLocal(reason) {
    var arr = getLocalChartsArray();
    if (!arr.length) {
      showError('No se pudo cargar el tablero (' + (reason || 'sin datos') + ') y no hay caché local.');
      return false;
    }
    renderDashboard(normalizeDashboard({ echarts_option: arr[0] }));
    return true;
  }

  function loadFromData(data) {
    var dash = normalizeDashboard(data);
    if (!dash) throw new Error('La respuesta no incluye un tablero válido.');
    renderDashboard(dash);
  }

  function load() {
    if (!token) {
      if (!tryFallbackToLocal('sin token')) {
        showError('Falta el parámetro <code>token</code> en la URL y no hay gráficas locales guardadas todavía.');
      }
      return;
    }
    loadingEl.hidden = false;
    btnPng.disabled = true;
    btnReload.disabled = true;
    fetchSession(token)
      .then(function (data) {
        if (data && data.__pending404) {
          if (tryFallbackToLocal('sesión 404')) return;
          showPreparing('No hay una sesión de gráfica lista todavía. Vuelve al chat y pide un análisis con datos.');
          if (window.parent !== window) {
            try {
              window.parent.postMessage({ type: 'insightflow-dashboard', action: 'token_refresh', status: 404 }, '*');
            } catch (e) {}
          }
          return;
        }
        if (data && data.__pending) {
          if (tryFallbackToLocal('preparando')) return;
          showPreparing(data.message);
          return;
        }
        loadFromData(data);
      })
      .catch(function (e) {
        if (tryFallbackToLocal(e.message || 'fetch error')) return;
        showError('No se pudo cargar el tablero: ' + (e.message || String(e)));
      });
  }

  btnReload.addEventListener('click', function () {
    disposeCharts();
    boardEl.innerHTML = '';
    load();
  });

  btnFilter.addEventListener('click', function () {
    alert('Los filtros interactivos llegarán en una próxima versión. Por ahora itera la pregunta en el chat.');
  });

  btnPng.addEventListener('click', function () {
    if (!chartInstances.length) return;
    var url = chartInstances[0].getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#0b0e1b' });
    var a = document.createElement('a');
    a.href = url;
    a.download = 'insightflow-tablero.png';
    a.click();
  });

  load();
})();
  </script>
</body>
</html>
